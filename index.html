<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfert de fichiers</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e26; --muted:#6b7080; --accent:#4f46e5; --border:#d9dce6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151b; --card:#1d1f28; --text:#eceef5; --muted:#9a9fb2; --accent:#818cf8; --border:#343748; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:1rem; }
  .card { background:var(--card); width:100%; max-width:480px; border-radius:16px; padding:2rem;
          box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 .25rem; font-size:1.5rem; }
  p.sub { margin:0 0 1.5rem; color:var(--muted); font-size:.95rem; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:2rem 1rem; text-align:center; cursor:pointer;
          transition:.15s; }
  #drop.over { border-color:var(--accent); background:rgba(79,70,229,.06); }
  #drop strong { color:var(--accent); }
  input[type=password] { width:100%; margin-top:1rem; padding:.7rem; border-radius:8px; border:1px solid var(--border);
          background:transparent; color:var(--text); font-size:1rem; }
  button { margin-top:1rem; width:100%; padding:.8rem; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  progress { width:100%; margin-top:1rem; height:10px; }
  .hidden { display:none; }
  #result { margin-top:1.25rem; padding:1rem; border-radius:10px; background:rgba(79,70,229,.08); word-break:break-all; }
  #result a { color:var(--accent); }
  .err { color:#dc2626; margin-top:1rem; font-size:.95rem; }
</style>
</head>
<body>
<main class="card">
  <h1>📁 Transfert de fichiers</h1>
  <p class="sub" id="info">Envoyez un fichier et partagez le lien.</p>

  <div id="drop"><strong>Cliquez</strong> ou déposez un fichier ici<br><span id="fname" style="color:var(--muted)"></span></div>
  <input type="file" id="file" class="hidden">
  <input type="password" id="pwd" class="hidden" placeholder="Mot de passe d'envoi">
  <button id="send" disabled>Envoyer</button>
  <progress id="bar" class="hidden" value="0" max="100"></progress>
  <div id="err" class="err hidden"></div>

  <div id="result" class="hidden">
    Lien de téléchargement :<br>
    <a id="link" href="#" target="_blank"></a>
    <button id="copy" type="button">Copier le lien</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let chosen = null;

fetch('/api/config').then(r => r.json()).then(c => {
  $('info').textContent = `Taille max ${c.maxMb} Mo · lien valable ${c.expiryHours} h.`;
  if (c.passwordRequired) $('pwd').classList.remove('hidden');
});

function setFile(f) {
  chosen = f;
  $('fname').textContent = f ? f.name : '';
  $('send').disabled = !f;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => setFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

$('send').onclick = () => {
  if (!chosen) return;
  const fd = new FormData();
  fd.append('file', chosen);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  if (!$('pwd').classList.contains('hidden')) xhr.setRequestHeader('x-upload-password', $('pwd').value);
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('bar').value = (e.loaded / e.total) * 100; };
  xhr.onload = () => {
    $('send').disabled = false;
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 200) {
      $('link').href = data.url; $('link').textContent = data.url;
      $('result').classList.remove('hidden');
    } else {
      $('err').textContent = data.error || 'Erreur lors de l\'envoi.';
      $('err').classList.remove('hidden');
    }
    $('bar').classList.add('hidden');
  };
  xhr.onerror = () => { $('err').textContent = 'Erreur réseau.'; $('err').classList.remove('hidden'); $('send').disabled = false; };
  $('err').classList.add('hidden'); $('result').classList.add('hidden');
  $('bar').value = 0; $('bar').classList.remove('hidden'); $('send').disabled = true;
  xhr.send(fd);
};

$('copy').onclick = () => { navigator.clipboard.writeText($('link').href); $('copy').textContent = 'Copié ✓'; };
</script>
</body>
</html>
