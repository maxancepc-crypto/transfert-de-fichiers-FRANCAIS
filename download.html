<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Télécharger le fichier</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e26; --muted:#6b7080; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151b; --card:#1d1f28; --text:#eceef5; --muted:#9a9fb2; --accent:#818cf8; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:1rem; }
  .card { background:var(--card); width:100%; max-width:440px; border-radius:16px; padding:2rem; text-align:center;
          box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:1.2rem; word-break:break-all; margin:.5rem 0; }
  p { color:var(--muted); }
  a.btn { display:inline-block; margin-top:1rem; padding:.8rem 1.5rem; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main class="card" id="box"><p>Chargement…</p></main>
<script>
const id = location.pathname.split('/').pop();
const fmt = (n) => n > 1048576 ? (n/1048576).toFixed(1)+' Mo' : Math.max(1, Math.round(n/1024))+' Ko';
fetch('/api/info/' + id).then(async r => {
  const box = document.getElementById('box');
  if (!r.ok) { box.innerHTML = '<h1>Fichier introuvable</h1><p>Le lien est invalide ou a expiré.</p>'; return; }
  const m = await r.json();
  const h1 = document.createElement('h1'); h1.textContent = '📄 ' + m.name;
  box.innerHTML = '';
  box.append(h1);
  box.insertAdjacentHTML('beforeend',
    `<p>${fmt(m.size)} · expire le ${new Date(m.expiresAt).toLocaleString('fr-FR')}</p>
     <a class="btn" href="/d/${id}">Télécharger</a>`);
});
</script>
</body>
</html>
